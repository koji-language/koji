[package]
name = "koji_runtime"
version = "0.1.0"
edition = "2021"
description = "The runtime of compiled Koji programs: strings, output and panics, called from the generated C."

[dependencies]
regex = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[lib]
path = "src/lib.rs"
