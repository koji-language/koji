[package]
name = "koji"
version = "0.1.0"
edition = "2021"
description = "The tests of Koji: they build the compiler written in Koji (compiler/) from the seed (bootstrap/) and run it. build.rs builds the runtime (runtime/)."
autobins = false
autolib = false

[[test]]
name = "language"
path = "test/language.rs"

[[test]]
name = "compiler"
path = "test/compiler.rs"

[[test]]
name = "stages"
path = "test/stages.rs"

[[test]]
name = "crypto"
path = "test/crypto.rs"

[[test]]
name = "bootstrap"
path = "test/bootstrap.rs"
