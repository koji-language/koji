[package]
name = "kojic"
version = "0.1.0"
edition = "2021"

[dependencies]
koji_runtime = { path = "runtime" }
regex = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[[test]]
name = "lexer"
path = "test/lexer.rs"

[[test]]
name = "language"
path = "test/language.rs"

[[test]]
name = "compiler"
path = "test/compiler.rs"

[[test]]
name = "bootstrap"
path = "test/bootstrap.rs"
